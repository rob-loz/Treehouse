<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Apartment 3D Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2a2e;--muted:#5d6b70;--chip:#ffffffd9;--accent:#2f6f6a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#dfe9f1}
  #c{position:fixed;inset:0;display:block;touch-action:none}
  header{position:fixed;top:0;left:0;right:0;padding:12px 16px 8px;pointer-events:none;
    background:linear-gradient(#dfe9f1f0,#dfe9f100)}
  header h1{margin:0;font-size:17px;font-weight:600}
  header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  #labels{position:fixed;inset:0;pointer-events:none}
  .lbl{position:absolute;transform:translate(-50%,-50%);background:#ffffffe6;border-radius:8px;
    padding:3px 8px;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:0 1px 4px #0002;text-align:center;line-height:1.25}
  .lbl span{display:block;font-weight:400;color:var(--muted);font-size:10px}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(#dfe9f100,#dfe9f1f5 35%)}
  .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
  .row::-webkit-scrollbar{display:none}
  .row+.row{margin-top:6px}
  button{flex:none;border:0;border-radius:999px;padding:8px 13px;font:500 13px Inter,system-ui,sans-serif;
    background:var(--chip);color:var(--ink);box-shadow:0 1px 3px #0002;cursor:pointer}
  button.on{background:var(--accent);color:#fff}
  .tog{background:#ffffffaa}
  #hint{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<header>
  <h1>Your apartment</h1>
  <p>2 bed · 1 bath · balcony. Built from your floor plan and photos</p>
</header>
<div id="bar">
  <div class="row" id="views"></div>
  <div class="row">
    <button class="tog" id="tWalls">Walls: low</button>
    <button class="tog" id="tSpin">Auto-rotate: off</button>
  </div>
  <div id="hint">Drag to rotate · pinch to zoom · two-finger drag to pan</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color('#dfe9f1');
scene.fog=new THREE.Fog('#dfe9f1',30,60);
const camera=new THREE.PerspectiveCamera(50,1,0.05,200);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.maxPolarAngle=Math.PI*0.49;controls.minDistance=0.3;controls.maxDistance=35;

// Lights
scene.add(new THREE.HemisphereLight('#ffffff','#b9b2a6',0.75));
const sun=new THREE.DirectionalLight('#fff6e8',0.75);
sun.position.set(-6,12,-5);sun.target.position.set(3.2,0,3.6);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:40});
sun.shadow.bias=-0.0005;
scene.add(sun,sun.target);

// Helpers
const mats={};
function M(c,o){const k=c+JSON.stringify(o||{});if(!mats[k])mats[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0},o||{}));return mats[k];}
function boxR(x1,x2,y1,y2,z1,z2,mat,parent){
  const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2-x1),Math.abs(y2-y1),Math.abs(z2-z1)),mat);
  m.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);m.castShadow=true;m.receiveShadow=true;(parent||furn).add(m);return m;}
function cyl(rt,rb,h,x,y,z,mat,parent,seg){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||28),mat);
  m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;(parent||furn).add(m);return m;}

const furn=new THREE.Group();scene.add(furn);
const wallItems=new THREE.Group();scene.add(wallItems);
let wallGroup=new THREE.Group();scene.add(wallGroup);

// Materials
const WALL=M('#f3f1ec'),WHITE=M('#fbfbfa',{roughness:0.4}),FRAME=M('#e9ecee',{roughness:0.5,metalness:0.2});
const GLASS=new THREE.MeshStandardMaterial({color:'#bfe0ef',transparent:true,opacity:0.22,roughness:0.05,metalness:0.1,depthWrite:false});
const FROST=new THREE.MeshStandardMaterial({color:'#eef3f5',transparent:true,opacity:0.92,roughness:1});
const TIMBER=M('#b9844f'),WALNUT=M('#5b3a26'),STEEL=M('#b7bcbf',{metalness:0.6,roughness:0.35}),BLACK=M('#1c1d1f',{roughness:0.3});
const RAIL=M('#2b2f31',{roughness:0.5});
const WOOD=M('#b67a4b',{roughness:0.55}),WOOD2=M('#a96d40',{roughness:0.55}),WLINE=M('#7e4e2c'),PULL=M('#4a3a2c',{roughness:0.4});
const CREAM=M('#f2e8d3');
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const GREEN_TILE=canvasTex(256,96,(g,w,h)=>{g.fillStyle='#cfd6cf';g.fillRect(0,0,w,h);const grd=g.createLinearGradient(0,0,0,h);grd.addColorStop(0,'#24684c');grd.addColorStop(1,'#1b5640');g.fillStyle=grd;g.fillRect(3,3,w-6,h-6);g.fillStyle='#ffffff18';g.fillRect(6,6,w-12,10);});

// ---------- Floors (x east, z south, metres) ----------
function floor(x1,x2,z1,z2,c,y){const m=boxR(x1,x2,(y||0)-0.04,(y||0),z1,z2,M(c),scene);m.castShadow=false;}
boxR(-0.25,6.75,-0.32,-0.04,-0.25,8.05,M('#c9c4bb'),scene).castShadow=false; // slab
floor(0,4.5,0,3.6,'#dcdad5');          // living carpet
floor(0.6,0.61,2.5,3.6,'#dcdad5');
floor(2.9,3.83,3.6,5.35,'#dcdad5');    // hall
floor(4.5,6.5,0,3.6,'#d3d5d6');        // kitchen: light grey tiles
floor(0.6,2.9,3.6,5.35,'#d3d5d6');     // bath: light grey tiles
floor(0.6,3.83,5.35,7.8,'#5c4c41');    // bedroom 1 (dark carpet)
floor(3.83,6.5,3.6,7.8,'#d6cfc2');     // bedroom 2 (light carpet)
floor(0.84,5.64,-1.2,0,'#a3a6a8');     // balcony tiles
boxR(0.84,5.64,-0.32,-0.04,-1.25,0,M('#c9c4bb'),scene);
// tile grid on balcony + bath
(function(){const g=new THREE.Group();const lm=new THREE.LineBasicMaterial({color:'#8a8d8f'});
 const pts=[];for(let x=0.84;x<=5.65;x+=0.6)pts.push(x,0.002,-1.2,x,0.002,0);for(let z=-1.2;z<=0.01;z+=0.6)pts.push(0.84,0.002,z,5.64,0.002,z);
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));g.add(new THREE.LineSegments(geo,lm));
 const p2=[],bl=new THREE.LineBasicMaterial({color:'#aeb1b3'});for(let x=0.6;x<=2.91;x+=0.6)p2.push(x,0.002,3.6,x,0.002,5.35);for(let z=3.6;z<=5.36;z+=0.6)p2.push(0.6,0.002,z,2.9,0.002,z);
 const g2=new THREE.BufferGeometry();g2.setAttribute('position',new THREE.Float32BufferAttribute(p2,3));g.add(new THREE.LineSegments(g2,bl));scene.add(g);})();
// kitchen floor tile grid
(function(){const p=[];for(let x=4.5;x<=6.51;x+=0.6)p.push(x,0.002,0,x,0.002,3.6);for(let z=0;z<=3.61;z+=0.6)p.push(4.5,0.002,z,6.5,0.002,z);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:'#aeb1b3'})));})();

// ---------- Walls ----------
// axis 'x': wall runs along x at z=fixed ; axis 'z': runs along z at x=fixed
const WALLS=[
 ['x',0,0,6.5,0.2,[{a:0.9,b:4.4,y0:0,y1:2.2,glass:'slider',splits:[0.25,0.5,0.75]},{a:4.65,b:5.6,y0:1.0,y1:2.2,glass:'win'}]],
 ['z',6.5,0,7.8,0.2,[{a:0.3,b:2.9,y0:1.0,y1:2.2,glass:'win',splits:[0.25,0.75]},{a:3.72,b:7.68,y0:0.9,y1:2.2,glass:'win',splits:[0.25,0.5,0.75]}]],
 ['x',7.8,0.6,6.5,0.2,[]],
 ['z',0,0,2.5,0.2,[{a:0.15,b:2.35,y0:0.35,y1:2.3,glass:'tall'}]],
 ['x',2.5,0,0.6,0.2,[]],
 ['z',0.6,2.5,7.8,0.2,[{a:2.7,b:3.5,y0:0,y1:2.05},{a:3.9,b:5.2,y0:1.5,y1:2.1,glass:'win',frost:true},{a:5.85,b:7.6,y0:1.2,y1:2.1,glass:'win'}]],
 ['x',3.6,0.6,2.9,0.12,[]],
 ['z',2.9,3.6,5.35,0.12,[{a:3.75,b:4.5,y0:0,y1:2.05}]],
 ['x',5.35,0.6,3.83,0.12,[{a:2.95,b:3.75,y0:0,y1:2.05}]],
 ['z',3.83,3.6,7.8,0.12,[{a:4.4,b:5.2,y0:0,y1:2.05}]],
 ['x',3.6,3.83,6.5,0.12,[]],
 ['x',5.55,0.9,2.1,0.4,[]],   // nib in 2nd bedroom: 0.4 m deep, runs 1.6 m from the window wall
];
function seg(ax,f,a,b,y0,y1,th,mat,g){
  if(y1<=y0+0.001||b<=a)return;
  if(ax==='x')boxR(a,b,y0,y1,f-th/2,f+th/2,mat,g);else boxR(f-th/2,f+th/2,y0,y1,a,b,mat,g);}
function buildWalls(H){
  scene.remove(wallGroup);wallGroup=new THREE.Group();scene.add(wallGroup);
  for(const [ax,f,a1,a2,th,ops] of WALLS){
    let cur=a1-th/2;const end=a2+th/2;
    const sorted=ops.slice().sort((p,q)=>p.a-q.a);
    for(const o of sorted){
      seg(ax,f,cur,o.a,0,H,th,WALL,wallGroup);
      seg(ax,f,o.a,o.b,0,Math.min(o.y0,H),th,WALL,wallGroup);
      seg(ax,f,o.a,o.b,o.y1,H,th,WALL,wallGroup);
      if(o.glass&&o.y0<H){
        const top=Math.min(o.y1,H);
        const GM=o.frost?FROST:GLASS;const pane=ax==='x'?boxR(o.a,o.b,o.y0,top,f-0.01,f+0.01,GM,wallGroup):boxR(f-0.01,f+0.01,o.y0,top,o.a,o.b,GM,wallGroup);
        pane.castShadow=false;
        const ft=0.045,fd=th*0.6;
        seg(ax,f,o.a,o.b,o.y0,o.y0+ft,fd,FRAME,wallGroup);
        if(o.y1<=H)seg(ax,f,o.a,o.b,o.y1-ft,o.y1,fd,FRAME,wallGroup);
        seg(ax,f,o.a,o.a+ft,o.y0,top,fd,FRAME,wallGroup);seg(ax,f,o.b-ft,o.b,o.y0,top,fd,FRAME,wallGroup);
        const sp=o.splits||(o.glass==='win'?[0.5]:[1/3,2/3]);
        for(const fr of sp){const m=o.a+(o.b-o.a)*fr;seg(ax,f,m-ft/2,m+ft/2,o.y0,top,fd,FRAME,wallGroup);}
        if(o.glass==='tall'&&H>1.3)seg(ax,f,o.a,o.b,1.25,1.25+ft,fd,FRAME,wallGroup);
      }
      cur=o.b;
    }
    seg(ax,f,cur,end,0,H,th,WALL,wallGroup);
  }
  // doors (angle opens leaf)
  const dh=Math.min(2.03,H);
  door(0.6,3.5,0.8,[0.94,-0.34],'#3a2f2a',dh);   // entry (hinged on the south side)
  door(2.9,4.5,0.75,[-0.94,-0.34],'#f7f7f5',dh); // bath
  door(3.75,5.35,0.8,[-0.34,0.94],'#f7f7f5',dh); // bedroom 1
  door(3.83,4.4,0.8,[0.94,0.34],'#f7f7f5',dh);  // bedroom 2
  // wall finishes
  paintRoom(3.83,6.5,3.6,7.8,H,[{y0:0,y1:9,mat:M('#f7d3b5')}]);           // main bedroom: pastel apricot
  const OR=[{y0:0,y1:9,mat:M('#f7e9a8')}];                                 // 2nd bedroom: pastel yellow
  paintSide('x',5.55,1,0.7,2.3,H,OR);paintSide('x',5.35,1,2.3,3.77,H,OR);seg('z',2.305,5.41,5.75,0,H,0.008,OR[0].mat,wallGroup);
  paintSide('z',0.6,1,5.75,7.7,H,OR);paintSide('z',3.83,-1,5.41,7.7,H,OR);paintSide('x',7.8,-1,0.7,3.77,H,OR);
  const YE=[{y0:0,y1:9,mat:M('#f6b987')}];                                 // living + kitchen: pastel orange
  paintSide('x',0,1,0.1,6.4,H,YE);paintSide('z',0,1,0.1,2.4,H,YE);paintSide('x',2.5,-1,0.1,0.5,H,YE);paintSide('z',0.6,1,2.6,3.54,H,YE);
  paintSide('x',3.6,-1,0.7,2.84,H,YE);paintSide('x',3.6,-1,3.89,6.4,H,YE);paintSide('z',6.5,-1,0.1,3.54,H,YE);
  const RE=[{y0:0,y1:9,mat:M('#f1b3ad')}];                                 // hallway: pastel red
  paintSide('z',2.9,1,3.6,5.29,H,RE);paintSide('z',3.83,-1,3.6,5.29,H,RE);paintSide('x',5.35,-1,2.96,3.77,H,RE);
  paintRoom(0.6,2.9,3.6,5.35,H,[{y0:0,y1:2.1,tile:true},{y0:2.1,y1:9,mat:CREAM}]); // bath: green tile to window head, cream above
  const rh=Math.min(2.3,H);
  // main bedroom built-in robe
  boxR(3.89,6.4,0,rh,3.66,4.27,WOOD,wallGroup);
  for(let x=4.73;x<6.4;x+=0.84)boxR(x-0.006,x+0.006,0.02,rh-0.02,4.27,4.275,WLINE,wallGroup);
  wallItems.visible=H>2;
}
function findWall(ax,f,a){return WALLS.find(w=>w[0]===ax&&Math.abs(w[1]-f)<0.01&&a>=w[2]-0.01&&a<=w[3]+0.01);}
function paintSide(ax,f,dir,s1,s2,H,layers){
  const w=findWall(ax,f,(s1+s2)/2);if(!w)return;
  const ff=f+dir*(w[4]/2+0.005);
  const ops=WALLS.filter(q=>q[0]===ax&&Math.abs(q[1]-f)<0.01).flatMap(q=>q[5]).filter(o=>o.b>s1&&o.a<s2);
  const xs=[s1,s2,...ops.flatMap(o=>[Math.max(o.a,s1),Math.min(o.b,s2)])].sort((p,q)=>p-q);
  for(const L of layers){const y0=L.y0,y1=Math.min(L.y1,H);if(y1<=y0)continue;
    for(let i=0;i<xs.length-1;i++){const a=xs[i],b=xs[i+1];if(b-a<0.002)continue;const m=(a+b)/2;
      const o=ops.find(o=>m>o.a&&m<o.b);
      const rs=o?[[y0,Math.min(y1,o.y0)],[Math.max(y0,o.y1),y1]]:[[y0,y1]];
      for(const[r0,r1]of rs)if(r1>r0+0.002)seg(ax,ff,a,b,r0,r1,0.008,L.mat,wallGroup);}}}
function paintRoom(x1,x2,z1,z2,H,layers){
  const sides=[['x',z1,1,x1,x2],['x',z2,-1,x1,x2],['z',x1,1,z1,z2],['z',x2,-1,z1,z2]];
  for(const[ax,f,dir,a1,a2]of sides){
    const w=findWall(ax,f,(a1+a2)/2);if(!w)continue;
    const ff=f+dir*(w[4]/2+0.005),perp=ax==='x'?'z':'x';
    const wA=findWall(perp,a1,f+dir*0.3),wB=findWall(perp,a2,f+dir*0.3);
    const s1=a1+(wA?wA[4]/2:0),s2=a2-(wB?wB[4]/2:0);
    const ops=WALLS.filter(q=>q[0]===ax&&Math.abs(q[1]-f)<0.01).flatMap(q=>q[5]).filter(o=>o.b>s1&&o.a<s2);
    const xs=[s1,s2,...ops.flatMap(o=>[Math.max(o.a,s1),Math.min(o.b,s2)])].sort((p,q)=>p-q);
    for(const L of layers){const y0=L.y0,y1=Math.min(L.y1,H);if(y1<=y0)continue;
      for(let i=0;i<xs.length-1;i++){const a=xs[i],b=xs[i+1];if(b-a<0.002)continue;const m=(a+b)/2;
        const o=ops.find(o=>m>o.a&&m<o.b);
        const rs=o?[[y0,Math.min(y1,o.y0)],[Math.max(y0,o.y1),y1]]:[[y0,y1]];
        for(const[r0,r1]of rs){if(r1<=r0+0.002)continue;let mat=L.mat;
          if(L.tile){const t=GREEN_TILE.clone();t.needsUpdate=true;t.repeat.set((b-a)/0.3,(r1-r0)/0.1);mat=new THREE.MeshStandardMaterial({map:t,roughness:0.25});}
          seg(ax,ff,a,b,r0,r1,0.008,mat,wallGroup);}}}}}
function door(hx,hz,w,dir,color,h){
  const p=new THREE.Group();p.position.set(hx,0,hz);p.rotation.y=Math.atan2(-dir[1],dir[0]);
  const leaf=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.04),M(color,{roughness:0.5}));
  leaf.position.set(w/2,h/2,0);leaf.castShadow=true;p.add(leaf);
  const handle=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.02,0.06),STEEL);handle.position.set(w-0.08,1.0,0);if(h>1.0)p.add(handle);
  wallGroup.add(p);}

// ---------- Living ----------
const MUSTARD=M('#d7a64a');
boxR(1.1,2.8,0.002,0.012,0.7,2.6,M('#9c9a96'));                  // rug
// built-in day bed, full length of the west wall, storage drawers under
boxR(0.1,1.05,0,0.42,0.1,2.4,WOOD);
for(const z0 of[0.14,0.9,1.66])for(const[y0,y1]of[[0.04,0.21],[0.23,0.4]]){boxR(1.05,1.065,y0,y1,z0,z0+0.72,WOOD2);boxR(1.065,1.075,(y0+y1)/2-0.01,(y0+y1)/2+0.01,z0+0.26,z0+0.46,PULL);}
boxR(0.12,1.0,0.42,0.6,0.12,2.38,M('#ede6d9'));                  // mattress
boxR(0.12,0.3,0.6,0.85,0.14,2.36,M('#c9b89c'));                  // back bolster
boxR(0.3,0.95,0.6,0.75,0.12,0.3,M('#c9b89c'));boxR(0.3,0.95,0.6,0.75,2.2,2.38,M('#c9b89c'));
boxR(0.3,0.45,0.6,0.95,0.7,1.1,MUSTARD);boxR(0.3,0.45,0.6,0.95,1.4,1.8,MUSTARD);
cyl(0.5,0.5,0.06,1.85,0.33,1.65,M('#efece6',{roughness:0.6}));   // coffee table
for(let i=0;i<3;i++){const a=i*2.094+0.5;boxR(1.85+Math.cos(a)*0.3-0.06,1.85+Math.cos(a)*0.3+0.06,0,0.33,1.65+Math.sin(a)*0.3-0.1,1.65+Math.sin(a)*0.3+0.1,TIMBER);}
boxR(1.7,1.98,0.39,0.47,1.5,1.72,M('#2f7f8a'));                 // books
// orange swivel tub chair (Dyvlinge-style) between coffee table and balcony doors, facing the table
(function(x,z){const O=M('#e2692b',{roughness:0.9}),g=new THREE.Group();g.position.set(x,0,z);
 const add=(geo,mat,px,py,pz)=>{const m=new THREE.Mesh(geo,mat);m.position.set(px,py,pz);m.castShadow=true;m.receiveShadow=true;g.add(m);return m;};
 add(new THREE.CylinderGeometry(0.3,0.3,0.02,32),BLACK,0,0.01,0);
 add(new THREE.CylinderGeometry(0.03,0.03,0.22,12),BLACK,0,0.12,0);

function artTex(seed,pal){return canvasTex(256,256,(g,w,h)=>{let r=seed;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;};
  g.fillStyle=pal[0];g.fillRect(0,0,w,h);
  for(let i=0;i<5;i++){g.fillStyle=pal[1+i%(pal.length-1)];const t=rnd();
    if(t<0.4){g.beginPath();g.arc(rnd()*w,rnd()*h,20+rnd()*70,0,Math.PI*2);g.fill();}
    else if(t<0.75)g.fillRect(rnd()*w*0.7,rnd()*h*0.7,30+rnd()*120,20+rnd()*90);
    else{g.beginPath();g.moveTo(rnd()*w,rnd()*h);g.lineTo(rnd()*w,rnd()*h);g.lineTo(rnd()*w,rnd()*h);g.fill();}}});}
// picture on a wall. ax 'x': wall along x at z=f, facing dir (+1 = +z); ax 'z': wall along z at x=f
function picture(ax,f,dir,c,yc,w,h,fc,seed,pal){
  const d=0.03,m=0.04;
  if(ax==='x'){boxR(c-w/2,c+w/2,yc-h/2,yc+h/2,f,f+dir*d,M(fc),wallItems);}
  else boxR(f,f+dir*d,yc-h/2,yc+h/2,c-w/2,c+w/2,M(fc),wallItems);
  const mat=new THREE.MeshStandardMaterial({map:artTex(seed,pal),roughness:0.8});
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(w-2*m,h-2*m),mat);
  if(ax==='x'){pl.position.set(c,yc,f+dir*(d+0.002));if(dir<0)pl.rotation.y=Math.PI;}
  else{pl.position.set(f+dir*(d+0.002),yc,c);pl.rotation.y=dir>0?Math.PI/2:-Math.PI/2;}
  wallItems.add(pl);}

const ROOMS=[

let showLabels=false;
const v=new THREE.Vector3();
function updateLabels(){
  const w=innerWidth,h=innerHeight;
  ROOMS.forEach((r,i)=>{const el=labelEls[i];
    if(!showLabels||camera.position.y<3){el.style.display='none';return;}
    v.set(r[2],0.9,r[3]);const dist=camera.position.distanceTo(v);v.project(camera);
    if(v.z>1||dist<1.2||Math.abs(v.x)>1.1||Math.abs(v.y)>1.1){el.style.display='none';return;}
    el.style.display='block';el.style.left=((v.x+1)/2*w)+'px';el.style.top=((1-v.y)/2*h)+'px';});
}

let wallMode='low',tween=null;
function setWalls(mode){wallMode=mode;buildWalls(mode==='low'?1.05:2.5);
  document.getElementById('tWalls').textContent='Walls: '+(mode==='low'?'low':'full');}
function go(i){const[,p,t]=VIEWS[i];
  tween={t0:performance.now(),dur:900,fp:camera.position.clone(),ft:controls.target.clone(),tp:new THREE.Vector3(...p),tt:new THREE.Vector3(...t)};
  document.querySelectorAll('#views button').forEach((b,j)=>b.classList.toggle('on',j===i));}
const viewsEl=document.getElementById('views');
VIEWS.forEach((vw,i)=>{const b=document.createElement('button');b.textContent=vw[0];b.onclick=()=>go(i);viewsEl.appendChild(b);});
document.getElementById('tWalls').onclick=()=>setWalls(wallMode==='low'?'full':'low');
document.getElementById('tSpin').onclick=e=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=0.8;e.target.textContent='Auto-rotate: '+(controls.autoRotate?'on':'off');e.target.classList.toggle('on',controls.autoRotate);};
controls.addEventListener('start',()=>{tween=null;});

camera.position.set(...VIEWS[0][1]);controls.target.set(...VIEWS[0][2]);setWalls('full');
viewsEl.firstChild.classList.add('on');

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w<h?68:52;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

function loop(now){
  if(tween){let k=Math.min(1,(now-tween.t0)/tween.dur);k=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(tween.fp,tween.tp,k);controls.target.lerpVectors(tween.ft,tween.tt,k);if(k>=1)tween=null;}
  controls.update();renderer.render(scene,camera);updateLabels();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
